    <g transform="rotate(72)"><ellipse cx="0" cy="-12" rx="5.5" ry="9" fill="#D48A8A" opacity="0.95"/></g>
    <g transform="rotate(144)"><ellipse cx="0" cy="-12" rx="5.5" ry="9" fill="#D48A8A" opacity="0.95"/></g>
    <g transform="rotate(216)"><ellipse cx="0" cy="-12" rx="5.5" ry="9" fill="#D48A8A" opacity="0.95"/></g>
    <g transform="rotate(288)"><ellipse cx="0" cy="-12" rx="5.5" ry="9" fill="#D48A8A" opacity="0.95"/></g>
